apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: get-build-params
spec:
  params:
    - name: SOURCE_ARTIFACT
      type: string
      description: >-
        The Trusted Artifact URI pointing to the artifact with the application source code.
  results:
    - name: annotations
      type: array
      description: ANNOTATIONS array for buildah
    - name: labels
      type: array
      description: LABELS array for buildah
  steps:
    - name: use-trusted-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:d7e9f457d819b91d5f4b62effea105d54c6e54bedcc3afb2a7a9fcaaf752076b
      args:
        - use
        - $(params.SOURCE_ARTIFACT)=/tekton/home/source
    - name: set-results
      image: registry.access.redhat.com/ubi9/python-312-minimal:9.9-1793849672@sha256:8763032e21745e808102758c6ccf89b23cbe8ca44f39fc9311ee8304026eb311
      env:
        - name: ANNOTATIONS_RESULT
          value: $(results.annotations.path)
        - name: LABELS_RESULT
          value: $(results.labels.path)
      workingDir: /tekton/home/source
      script: |
        #!/bin/sh
        set -eu

        package_version=$(cat VERSION)

        printf '["org.opencontainers.image.version=%s"]' "$package_version" > "$ANNOTATIONS_RESULT"
        printf '[
          "org.opencontainers.image.version=%s",
          "version=%s"
        ]' "$package_version" "$package_version" > "$LABELS_RESULT"
